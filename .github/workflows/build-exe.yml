name: Build EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --onefile --console --name ISRC-Fetcher --collect-all ytmusicapi isrc_fetcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ISRC-Fetcher-windows
          path: dist/ISRC-Fetcher.exe
